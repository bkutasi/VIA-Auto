[project]
name = "via-auto"
version = "0.1.0"
description = "Automated VGG Image Annotator (VIA) backend using a trained neural network for inference."
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "scikit-image",
    "scikit-learn",
    "pillow",
    "matplotlib",
    "jupyter",
    "ipykernel",
]

[project.optional-dependencies]
tensorflow = ["tensorflow"]
pytorch = ["torch", "torchvision"]
